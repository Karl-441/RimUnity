# 第二层 CI：需要游戏安装（RimWorld 1.7 + Harmony）与 .NET 10 SDK，只能跑在自托管 runner 上。
# 触发方式是手动 workflow_dispatch：runner 没注册时，tag/push 触发只会把运行挂在队列里。
#
# 一次性准备（在自托管机器上）：
#   1. 注册 runner 时打上标签：self-hosted, windows, rimworld-1.7
#   2. 仓库 Settings → Secrets and variables → Actions → Variables 配两个仓库变量：
#        RIMWORLD_DIR  例：<Steam 库目录>\steamapps\common\RimWorld
#        HARMONY_PATH  例：<创意工坊目录>\content\294100\2009463077\1.7\Assemblies\0Harmony.dll
#   3. 装 .NET 10 SDK（Source/Directory.Build.props 的 TargetFramework 是 net10.0，只有 .NET 8 SDK 会 NETSDK1045）
#
# 三层里的后两层：构建 + 离线验证必跑，游戏内验证由 run-ingame 手动开启。
# 游戏内那步会真实启动游戏两次、临时换掉真实的 Mods/RimUnity；交换与恢复由
# Tools/ModsSwap.ps1 的 journal 保证（同卷原子 rename + 幂等修复），即使步骤被强杀，
# 下次运行也会先自动还原。
name: manual-verify

on:
  workflow_dispatch:
    inputs:
      run-pack:
        description: 额外执行 Tools/Pack.ps1 打出发布产物
        type: boolean
        default: false
      run-ingame:
        description: 额外跑游戏内验证（真实启动游戏两次，需要桌面会话）
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: 构建 + 离线验证
    runs-on: [self-hosted, windows, rimworld-1.7]
    env:
      RIMWORLD_DIR: ${{ vars.RIMWORLD_DIR }}
      HARMONY_PATH: ${{ vars.HARMONY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: 环境自检
        shell: pwsh
        run: |
          foreach ($name in 'RIMWORLD_DIR', 'HARMONY_PATH') {
            $value = [Environment]::GetEnvironmentVariable($name)
            if (-not $value) { throw "仓库变量 $name 没有配（Settings → Variables）" }
            if (-not (Test-Path -LiteralPath $value)) { throw "$name 指向的路径不存在：$value" }
          }
          dotnet --version
          dotnet --list-sdks

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Build.ps1 内部会经 Source/RimUnity.Spine/RimUnity.Spine.csproj 的 BuildEmbeddedRuntime 目标
      # 顺带构建内置运行时，所以这里不需要单独调 Tools/Build-Embedded.ps1。
      - name: 编译
        shell: pwsh
        run: ./Tools/Build.ps1

      - name: 着色器与内置运行时离线验证
        shell: pwsh
        run: ./Tools/Verify.ps1 -SkipBuild -Embedded

      # 第三层：真实启动游戏两次，验证程序集加载顺序、Def 归属与缓存提取。
      # 夹具路径由上一步 Verify-Embedded.ps1 写到 artifacts/verify/embedded-fixtures.txt。
      - name: 游戏内验证（可选）
        if: inputs.run-ingame
        shell: pwsh
        run: |
          $record = 'artifacts/verify/embedded-fixtures.txt'
          if (!(Test-Path -LiteralPath $record -PathType Leaf)) { throw '缺少夹具路径记录；离线验证步骤可能没有跑完。' }
          $fixtures = (Get-Content -LiteralPath $record -Raw).Trim()
          ./Tools/Test-EmbeddedInGame.ps1 -GameRoot $env:RIMWORLD_DIR -FixtureRoot $fixtures

      - name: 打包发布产物
        if: inputs.run-pack
        shell: pwsh
        run: ./Tools/Pack.ps1

      # 编译会改写两个被跟踪的二进制（1.7/Assemblies/RimUnity.dll 与 RimUnity.Core.dll，
      # .gitignore 特意没忽略它们），这里还原并断言工作区只剩预期的改动。
      - name: 还原被构建改写的被跟踪文件，并检查工作区
        if: always()
        shell: pwsh
        run: |
          git checkout -- 1.7/Assemblies/RimUnity.dll 1.7/Assemblies/RimUnity.Core.dll
          $dirty = git status --porcelain
          if ($dirty) { Write-Host $dirty; throw '工作区仍有改动：构建过程往仓库里写了不该写的东西' }
          Write-Host '工作区干净。'

      # 交换状态是崩溃安全设计的落点：跑完（无论哪一步失败）都不该留下未完成的 journal。
      - name: 确认没有遗留的 Mods 交换状态
        if: always()
        shell: pwsh
        run: |
          $status = & ./Tools/ModsSwap.ps1 -Action Status -GameRoot $env:RIMWORLD_DIR
          Write-Host $status
          if ($status -notmatch '没有未完成的交换') { throw "存在未完成的 Mods/RimUnity 交换：$status" }
